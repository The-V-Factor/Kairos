<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>#21 海拔距离尺回归</title>
<style>body{background:#141614;color:#f7f8eb;font:14px system-ui}button{padding:12px}iframe{display:block;width:402px;height:700px;border:0}pre{white-space:pre-wrap}</style>
<button id="run" disabled>运行海拔距离尺回归</button><button id="home" disabled>预览海拔首页</button><button id="preview" disabled>预览海拔补给</button><button id="settings" disabled>预览设置说明</button><pre id="results" role="status">使用本机 8845 端口的合成数据。</pre><iframe title="海拔测试页面"></iframe>
<script type="module">
import { loadLibrary, createPlan, activeEntry, updatePlan, setRoute, storeLibrary, libraryKey } from '../library.mjs';
import { routePoints } from '../routes.mjs';
import { newID } from '../plan.mjs';
import { storeProfile } from '../profile.mjs';
import { storeGels } from '../gels.mjs';
import { hapticsKey } from '../haptics.mjs';
const frame=document.querySelector('iframe'),out=document.querySelector('#results');
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const check=(v,m)=>{if(!v)throw Error(m);};
const $=id=>frame.contentDocument.getElementById(id);
const route={source:'igpsport-cn',id:'21',title:'合成山路',author:'Synthetic',region:'测试',distanceMeters:75000,ascentMeters:1200,points:routePoints(Array.from({length:751},(_,i)=>({latitude:23,longitude:113+i*.001,elevationMeters:Math.round(100+800*Math.sin(Math.PI*i/750)**2+100*Math.sin(i/26))})))};
function seed(){
 let lib=loadLibrary({getItem:()=>null},'2026-11-18').library;
 lib=createPlan(lib,{name:'周末山路',rideDate:'2026-11-18',totalDistanceMeters:75000});
 lib=updatePlan(lib,{...activeEntry(lib).plan,stops:[0,14500,31600,51100,75000].map((distanceMeters,i)=>({id:newID(),distanceMeters,kind:i===1?'water':'gel',name:'',reminder:i===1?'喝水':'吃胶'}))});
 lib=setRoute(lib,lib.activePlanID,route);storeLibrary(localStorage,lib);
 storeProfile(localStorage,{sex:'female',ageYears:30,heightCm:170,weightKg:70,ftpWatts:250});
 storeGels(localStorage,{version:1,items:[{id:newID(),name:'我的能量胶',carbsGrams:45}]});localStorage.removeItem(hapticsKey);
}
async function load(){await new Promise(r=>{frame.onload=r;frame.src='../';});await wait(150);}
async function click(id){$(id).click();await wait(90);}
async function generate(){await click('library');await click('plan-auto');$('fuel-gel').selectedIndex=1;$('fuel-gel').dispatchEvent(new frame.contentWindow.Event('change',{bubbles:true}));await wait(100);await click('fuel-preview-button');}
const curve=id=>$(id).querySelector('.ruler-profile').getAttribute('points');
const local=location.port==='8845'&&['localhost','127.0.0.1'].includes(location.hostname);
for(const b of document.querySelectorAll('button'))b.disabled=!local;
for(const id of ['home','preview','settings'])document.getElementById(id).onclick=async()=>{out.hidden=true;seed();await load();if(id==='preview')await generate();if(id==='settings'){await click('account');await click('help');}};
document.getElementById('run').onclick=async()=>{
 out.hidden=false;out.textContent='运行中…';let n=0;const ok=m=>{out.textContent+=`\n✓ ${m}`;n++;};
 try{
 seed();await load();const doc=frame.contentDocument,win=frame.contentWindow;
 check($('ruler').classList.contains('has-terrain'),'首页没有海拔');check($('ruler').querySelectorAll('.focus-tick').length===1,'指针重复');ok('首页只有一个高亮距离指针，真实路书显示海拔');
 const before=localStorage.getItem(libraryKey),initial=curve('ruler');
 const svg=$('ruler').querySelector('svg'),height=svg.viewBox.baseVal.height,ys=[...svg.querySelectorAll('.ruler-anchor')].map(p=>+p.getAttribute('cy'));
 check(new Set(ys.map(Math.round)).size>2,'补给没有贴随高低');
 const points=initial.split(' ').map(p=>p.split(',').map(Number));
 for(const anchor of svg.querySelectorAll('.ruler-anchor'))check(points.some(([x,y])=>Math.abs(x-Number(anchor.getAttribute('cx')))<.01&&Math.abs(y-Number(anchor.getAttribute('cy')))<.01),'补给锚点不在线上');
 check(height>150&&ys.length===5,'端点补给缺失');ok('0公里、终点及中间补给均锚定曲线，按实际海拔起伏');
 const axis=[...svg.querySelectorAll('.ruler-elevation-label')].map(p=>p.textContent).join();await click('zoom-in');
 check(curve('ruler')!==initial,'放大未改变曲线');check([...svg.querySelectorAll('.ruler-elevation-label')].map(p=>p.textContent).join()===axis,'缩放改变海拔基准');
 const slider=$('ruler').querySelector('[role=slider]');slider.dispatchEvent(new win.KeyboardEvent('keydown',{key:'End',bubbles:true}));await wait(400);
 check(slider.getAttribute('aria-valuenow')==='75000','键盘不能到终点');check(localStorage.getItem(libraryKey)===before,'浏览改变了补给');ok('缩放、键盘浏览保持纵轴一致且不改补给点');
 await click('fit');slider.dispatchEvent(new win.KeyboardEvent('keydown',{key:'Home',bubbles:true}));await wait(400);slider.dispatchEvent(new win.KeyboardEvent('keydown',{key:'PageDown',bubbles:true}));await wait(400);await load();await generate();const homeHeight=$('ruler').querySelector('.ruler-viewport').clientHeight,previewHeight=$('fuel-chart').querySelector('.ruler-viewport').clientHeight;
 check(homeHeight===previewHeight,'首页和预览组件高度不同');const a=curve('ruler').split(' ').map(p=>p.split(',').map(Number)),b=curve('fuel-chart').split(' ').map(p=>p.split(',').map(Number));const at=(pts,x)=>{const i=pts.findIndex(p=>p[0]>=x);if(i<=0)return pts[0][1];const l=pts[i-1],r=pts[i];return l[1]+(r[1]-l[1])*(x-l[0])/(r[0]-l[0]);};for(let t=0;t<=1;t+=.05)check(Math.abs(at(a,24+t*($('ruler').clientWidth-48))-at(b,24+t*($('fuel-chart').clientWidth-48)))<.15,'首页与预览同路线曲线不一致');
 check($('generation-dialog').scrollHeight<=$('generation-dialog').clientHeight+2,'手机预览整页溢出');check($('fuel-save').getBoundingClientRect().bottom<=700,'保存按钮离屏');ok('首页和预览使用相同剖面，402×700保存按钮可见');
 const pin=$('fuel-chart').querySelector('.ruler-marker');pin.click();await wait(350);check($('fuel-preview-stops').querySelector('.focused-stop'),'点补给未定位预览列表');ok('预览图上的补给点可定位对应条目');
 await click('fuel-save');await load();const savedCurve=curve('ruler');await load();check(curve('ruler')===savedCurve,'重载后海拔变化');ok('保存并重载后仍保留同一条海拔线');
 await click('account');await click('help');
 check(!frame.contentDocument.querySelector('#steps,#diagnostics,#diagnostics-copy')&&!$('help-dialog').textContent.match(/实验|测试阶段|调试/),'帮助仍有测试信息');
 check($('help-dialog').querySelectorAll('.how-to li').length===3,'使用说明不是三步');check($('help-dialog').scrollHeight<=$('help-dialog').clientHeight+2,'设置说明溢出');ok('精简说明为三步，无实验诊断内容，手机面板不溢出');
 const toggle=$('haptics-toggle'),available=!toggle.disabled;
 check(available?toggle.checked:!toggle.checked,'触感初始状态不正确');check(available||$('ruler').querySelector('.haptic-surface').hidden,'不支持设备仍覆盖手势');
 if(available){toggle.checked=false;toggle.dispatchEvent(new frame.contentWindow.Event('change',{bubbles:true}));check(localStorage.getItem(hapticsKey)==='false','关闭没有保存');await load();await click('account');await click('help');check(!$('haptics-toggle').checked,'关闭未保持');}
 ok('触感支持时默认开启并可保存关闭；不支持时不遮挡浏览');
 $('help-dialog').close();
 for(const theme of ['rhythm','trail','journal','pocket','precision']){
 frame.contentDocument.documentElement.dataset.theme=theme;await wait(50);
 check(frame.contentDocument.documentElement.scrollWidth<=402,`${theme}横向溢出`);
 const color=frame.contentWindow.getComputedStyle($('ruler').querySelector('.ruler-profile')).stroke;check(color!=='none',`${theme}曲线缺色`);
 check($('ruler').querySelector('.ruler-marker').getBoundingClientRect().height>=44,'补给点击区域过小');ok(`${theme}海拔距离尺布局与补给点击区域`);
 }
 out.textContent+=`\n全部通过：${n} 项。`;
 }catch(e){out.textContent+=`\n失败（已通过 ${n} 项）：${e.message}`;}
};
</script></html>
