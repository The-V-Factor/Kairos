<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#141614">
    <title>Kairos · 直接打开实验</title>
    <link rel="icon" href="../assets/app-icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../style.css">
  </head>
  <body>
    <header class="masthead"><a class="wordmark" href="../">KAIROS</a><a class="experiment-back" href="../">返回计划</a></header>
    <main class="direct-open-test help-body">
      <h1>训练文件打开测试</h1>
      <p>通过条件是在“健身”中看到这份训练的内容和添加按钮。</p>
      <p id="plan-summary" class="experiment-summary"></p>
      <p id="open-error" class="notice" role="status" hidden></p>

      <section class="open-case" aria-labelledby="case-a">
        <h2 id="case-a">A · 打开当前计划文件</h2>
        <p>在浏览器内准备文件后直接打开，不主动调用分享，也不设置强制下载。</p>
        <a id="open-local" class="primary" aria-disabled="true">打开当前计划</a>
      </section>
      <section class="open-case" aria-labelledby="case-b">
        <h2 id="case-b">B · 通过文件网址打开</h2>
        <p>浏览器在本机生成文件和本站地址。</p>
        <a id="open-address" class="primary" aria-disabled="true">准备文件地址…</a>
        <p id="address-status" class="fine-print" role="status"></p>
      </section>
      <section class="open-case" aria-labelledby="case-c">
        <h2 id="case-c">C · 固定示例作对照</h2>
        <p>服务器上的 1.0 km 示例，200 m 喝水，600 m 吃胶。</p>
        <a id="open-control" class="secondary" href="../assets/direct-open.workout">打开固定示例</a>
      </section>
      <p class="fine-print">A／B 使用本机已保存的计划，进入本页前先保存编辑。Safari 与添加到主屏幕后打开的行为需要分别测试。</p>
    </main>
    <script type="module" src="./test.mjs"></script>
  </body>
</html>
